name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  unittest:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[web]"
      - name: Test
        run: python -m unittest discover -s tests -v

  desktop:
    name: desktop-${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      OMISSIS_SYNC_JOBS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install desktop
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[desktop,web]"
      - name: Test desktop
        run: python -m unittest tests.test_desktop_ui -v

  windows-package:
    name: package-windows-installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa Inno Setup verificato
        shell: pwsh
        run: |
          $innoDir = Join-Path $env:RUNNER_TEMP "Inno Setup 6"
          .\scripts\install_inno_setup.ps1 -InstallDir $innoDir
          $innoDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Costruisci installer e ZIP portatile
        shell: pwsh
        run: .\scripts\build_windows_app.ps1
      - name: Verifica installazione silenziosa
        shell: pwsh
        run: |
          $installDir = Join-Path $env:RUNNER_TEMP "OMISSIS-installed"
          $process = Start-Process `
            -FilePath ".\dist\OMISSIS-Setup.exe" `
            -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/DIR=`"$installDir`"" `
            -Wait `
            -PassThru
          if ($process.ExitCode -ne 0) {
            throw "Installazione silenziosa non riuscita ($($process.ExitCode))."
          }
          if (-not (Test-Path (Join-Path $installDir "OMISSIS.exe"))) {
            throw "OMISSIS.exe non è presente nella cartella installata."
          }

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -t ai-data-anonymizer:test .
      - name: Smoke test Docker image
        run: |
          container_id="$(docker run --rm -d -p 8080:8080 ai-data-anonymizer:test)"
          cleanup() {
            docker stop "$container_id" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          for attempt in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/api/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs "$container_id"
          exit 1
